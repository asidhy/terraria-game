<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>泰拉瑞亚风格 2D 沙盒生存游戏</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0b0d14;
    overflow: hidden;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    user-select: none;
  }
  #wrap {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    cursor: crosshair;
    box-shadow: 0 0 60px rgba(0, 0, 0, 0.8);
  }
  #hint {
    position: fixed;
    left: 50%;
    bottom: 12px;
    transform: translateX(-50%);
    color: rgba(255, 255, 255, 0.42);
    font-size: 12px;
    letter-spacing: 0.5px;
    pointer-events: none;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="game"></canvas>
  </div>
  <div id="hint">A/D 移动 · 空格/W 跳跃 · 左键挖掘/放置/攻击 · 1~0 或滚轮切换快捷栏 · E 背包合成 · H 帮助</div>
  <script src="game.js"></script>
</body>
</html>
